{% load static %}

<div class="diary-editor" data-diary-editor data-diary-placeholder-poster="{% static 'img/placeholder-movie.svg' %}" data-diary-editor-search-url="{% url 'diary_movie_search' %}" hidden>
  <div class="diary-editor-backdrop" data-diary-editor-close></div>
  <div class="diary-editor-dialog card">
    <button type="button" class="secondary diary-editor-close" data-diary-editor-close aria-label="Close" title="Close">&times;</button>
    <div class="diary-editor-head">
      <img class="diary-editor-poster" data-diary-editor-poster src="{% static 'img/placeholder-movie.svg' %}" alt="" />
      <div class="diary-editor-copy">
        <h3 class="diary-editor-title-row">
          <span data-diary-editor-title>Diary entry</span>
          <span class="diary-editor-title-year" data-diary-editor-release>Unknown</span>
        </h3>
        <p class="muted diary-editor-meta-row" data-diary-editor-meta></p>
        <div class="diary-badges diary-entry-rating-row diary-editor-rating-line">
          <span class="diary-badge diary-rating-badge" data-diary-editor-rating-display>Not rated</span>
          <span class="diary-badge diary-icon-badge diary-icon-like" data-diary-editor-liked-display title="Liked" aria-label="Liked" hidden>
            <span class="diary-icon-mark" aria-hidden="true"></span>
          </span>
          <span class="diary-badge diary-icon-badge diary-icon-rewatch" data-diary-editor-rewatch-display title="Rewatch" aria-label="Rewatch" hidden></span>
        </div>
      </div>
    </div>

    <section class="diary-editor-overview" data-diary-editor-overview>
      <div class="diary-editor-field">
        <p class="diary-editor-review-display" data-diary-editor-review-display>No review yet.</p>
      </div>

      <div class="diary-editor-actions">
        {% if not hide_diary_editor_view_link %}
          <button type="button" class="diary-action diary-action-secondary" data-diary-editor-view hidden>Open movie</button>
        {% endif %}
        <button type="button" class="diary-action diary-action-secondary" data-diary-editor-posters hidden>Poster</button>
        <button type="button" class="diary-action diary-action-secondary" data-diary-editor-backdrops hidden>Backdrop</button>
        <button type="button" class="diary-action diary-action-primary" data-diary-editor-edit>Edit</button>
      </div>
    </section>

    <form method="post" class="diary-editor-form" data-diary-editor-form hidden>
      {% csrf_token %}
      <input type="hidden" name="tmdb_id" value="" data-diary-editor-tmdb-id />
      <input type="hidden" name="return_to" value="" data-diary-editor-return-to />

      <div class="diary-editor-field">
        <label for="diary-editor-search">Replace movie match</label>
        <div class="diary-editor-search-row">
          <input
            id="diary-editor-search"
            type="text"
            inputmode="search"
            placeholder="Movie name, year, or m:TMDb ID"
            data-diary-editor-search-input
          />
          <button type="button" class="diary-action diary-action-secondary diary-editor-search-button" data-diary-editor-search-button>Search</button>
        </div>
        <p class="diary-field-help">Search by title, year, or use <code>"m:{tmdbId}"</code> to jump straight to a TMDb movie ID.</p>
        <div class="diary-editor-search-results" data-diary-editor-search-results hidden></div>
        <div class="diary-field-errors" data-diary-editor-search-error hidden></div>
      </div>

      <div class="diary-editor-field">
        <label for="diary-editor-rating">Rating</label>
        <input type="hidden" id="diary-editor-rating" name="rating" value="" />
        <div class="diary-rating-picker" data-diary-rating-picker role="slider" tabindex="0" aria-label="Rate entry" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-valuetext="Not rated"></div>
        <div class="diary-rating-picker-value" data-diary-rating-picker-value aria-live="polite">Not rated</div>
      </div>
      <div class="diary-editor-toggles">
        <label class="diary-editor-toggle diary-editor-toggle-like">
          <input type="checkbox" name="liked" class="diary-editor-toggle-input" />
          <span class="diary-editor-toggle-visual">
            <span class="diary-badge diary-icon-badge diary-icon-like" aria-hidden="true"></span>
            <span class="diary-editor-toggle-text">Liked</span>
          </span>
        </label>
        <label class="diary-editor-toggle diary-editor-toggle-rewatch">
          <input type="checkbox" name="rewatch" class="diary-editor-toggle-input" />
          <span class="diary-editor-toggle-visual">
            <span class="diary-badge diary-icon-badge diary-icon-rewatch" aria-hidden="true"></span>
            <span class="diary-editor-toggle-text">Rewatch</span>
          </span>
        </label>
      </div>
      <div class="diary-editor-field">
        <label for="diary-editor-review">Review</label>
        <textarea id="diary-editor-review" name="review" rows="5" placeholder="Add notes or a short review..."></textarea>
      </div>
      <div class="diary-editor-actions">
        <button type="button" class="diary-action diary-action-secondary" data-diary-editor-cancel-edit>Cancel</button>
        <button type="submit" class="diary-action diary-action-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>
