<div class="image-lightbox" data-image-lightbox hidden aria-hidden="true">
  <div class="image-lightbox-layout">
    <div class="image-lightbox-stage" data-image-lightbox-stage>
      <img class="image-lightbox-image" data-image-lightbox-image alt="" />
      <div class="image-lightbox-status" data-image-lightbox-status>Loading image…</div>
    </div>

    <aside class="image-lightbox-rail" aria-label="Image controls">
      <button type="button" class="image-lightbox-close" data-image-lightbox-close aria-label="Close image viewer" title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </aside>
  </div>
</div>
